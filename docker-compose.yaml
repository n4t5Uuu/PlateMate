services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=platemate
      - POSTGRES_PASSWORD=platemate
      - POSTGRES_DB=platemate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platemate"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    # shortcut: pinned because newer localstack images require an auth token; revisit if we need newer AWS features
    image: localstack/localstack:4.14
    environment:
      - SERVICES=s3,sqs,lambda
    ports:
      - "4566:4566"

volumes:
  pgdata:
