services:
  postgres:
    images: posgtres16
    environment:
      - POSTGRES_USER=platemate
      - POSTGRES_PASSWORD=platemate
      - POSTGRES_DB=platemate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platemate"]
      interval: 10s
      timeout: 5s
      retries: 5

    localstack:
      image: localstack/localstack
      environment:
        - SERVICES: s3,sqs,lambda
      ports:
        - "4566:4566"

volumes:
  pgdata: