version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/frontend"
      - "/backend"
      - "/backend/db"
      - "/packages/*"
      - "/services/*"
      - "/infra"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
